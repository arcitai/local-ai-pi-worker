name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep shellcheck
      - name: Lint shell scripts
        run: shellcheck install.sh uninstall.sh doctor.sh bin/pi-worker bin/pi-worker-sync tests/test.sh tests/fixtures/bin/pi tests/fixtures/bin/curl
      - name: Run tests
        run: ./tests/test.sh
